name: CI

on:
  push:
    # Feature branches too: local builds are memory-bound, so CI does the full check.
    branches: [main, dev, 'feat/**']
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The same clippy and test gate on Windows and macOS (Apple Silicon and Intel). Formatting is
  # checked once, on Linux. UI tests run on Slint's testing backend, so no display is needed.
  platforms:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Fixtures and include_str! files must keep LF line endings on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # A cold build of the workspace takes long here; keep what compiled even when a check fails.
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - run: cargo test --workspace --no-fail-fast
