# Installable builds for every system, attached to a GitHub release for a `v*` tag (a manual run
# only uploads them as workflow artifacts):
#   Linux    x86_64 tar.gz and AppImage, plus the RPM and Flatpak of packaging.yml
#   Windows  x86_64 MSI installer and portable zip
#   macOS    <name>.app in a .dmg, Apple Silicon (arm64) and Intel (x86_64), ad-hoc signed
# Icons are rendered from packaging/<APP_ID>.svg; the Windows and macOS packages also ship the
# English and Arabic Hunspell dictionaries (packaging/release/). The product name, app id and
# binary come from the env block below, so renaming the app is a change there (plus the files
# named after the app id in packaging/).
name: Release

on:
  push:
    tags: ['v*']
    # A branch named ci/release-* builds everything without publishing, to try workflow changes
    # before they reach the default branch (a manual run needs the workflow there).
    branches: ['ci/release-*']
  workflow_dispatch:

# Read-only for every build job (they run downloaded tools and crate build scripts); only the
# publish job below may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The name users see (MSI product, .app bundle, Start menu, artifact file names).
  APP_NAME: IronTeams
  # Reverse-DNS id: macOS bundle identifier, and the name of the .desktop, .svg and .metainfo.xml.
  APP_ID: io.github.mohamedeslam04.kelma
  # The cargo package and binary that is shipped.
  BIN: kelma

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v=${GITHUB_REF_NAME#v}
          else v=$(sed -n 's/^version = "\(.*\)"/\1/p' "crates/$BIN/Cargo.toml" | head -1); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick icnsutils
      - run: bash packaging/release/icons.sh icons "packaging/$APP_ID.svg"
      - run: bash packaging/release/dictionaries.sh dictionaries
      - uses: actions/upload-artifact@v4
        with:
          name: shared-assets
          path: |
            icons/app.ico
            icons/app.icns
            dictionaries/

  linux:
    needs: meta
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libdbus-1-dev libasound2-dev cmake pkg-config libfuse2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p "$BIN" --bin "$BIN"
      - name: tar.gz
        run: |
          d=$APP_NAME-$VERSION-linux-x86_64
          mkdir -p "$d"
          cp "target/release/$BIN" "packaging/$APP_ID.desktop" "packaging/$APP_ID.svg" "packaging/$APP_ID.metainfo.xml" LICENSE README.md "$d/"
          tar -czf "$d.tar.gz" "$d"
      - name: AppImage
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          LDAI_OUTPUT=$APP_NAME-$VERSION-linux-x86_64.AppImage ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir -e "target/release/$BIN" \
            -d "packaging/$APP_ID.desktop" -i "packaging/$APP_ID.svg" --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            *.tar.gz
            *.AppImage

  windows:
    needs: [meta, icons]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p "$BIN" --bin "$BIN"
      - uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: assets
      - name: Stage
        run: |
          mkdir -p stage/dictionaries
          cp "target/release/$BIN.exe" stage/
          cp assets/icons/app.ico stage/app.ico
          cp LICENSE stage/LICENSE.txt
          cp assets/dictionaries/* stage/dictionaries/
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath "$env:APP_NAME-$env:VERSION-windows-x86_64-portable.zip"
      - name: MSI (WiX 5)
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          # MSI versions are numeric: drop a pre-release suffix such as -rc1.
          wix build packaging/windows/app.wxs -arch x64 -d "Version=${VERSION%%-*}" -d Stage=stage \
            -d "AppName=$APP_NAME" -d "Exe=$BIN.exe" -o "$APP_NAME-$VERSION-windows-x86_64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            *.zip
            *.msi

  macos:
    needs: [meta, icons]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p "$BIN" --bin "$BIN"
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
      - uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: assets
      - name: App bundle
        run: |
          app=dmg/$APP_NAME.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources/dictionaries"
          cp "target/release/$BIN" "$app/MacOS/"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@APP_NAME@/$APP_NAME/g" -e "s/@APP_ID@/$APP_ID/g" \
            -e "s/@EXECUTABLE@/$BIN/g" packaging/macos/Info.plist > "$app/Info.plist"
          cp assets/icons/app.icns "$app/Resources/app.icns"
          cp assets/dictionaries/* "$app/Resources/dictionaries/"
          cp LICENSE "$app/Resources/"
          # Ad-hoc signature: Apple Silicon refuses unsigned code. Not notarized (needs an Apple
          # Developer ID): the first start needs right click > Open, or System Settings > Privacy.
          codesign --force --deep --sign - "dmg/$APP_NAME.app"
          codesign --verify --deep --strict "dmg/$APP_NAME.app"
          ln -s /Applications dmg/Applications
      - name: dmg
        run: hdiutil create -volname "$APP_NAME" -srcfolder dmg -ov -format UDZO "$APP_NAME-$VERSION-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: '*.dmg'

  # The RPM and the Flatpak (and the AUR package check) as packaging.yml builds them.
  packages:
    uses: ./.github/workflows/packaging.yml

  publish:
    # Only when every build succeeded, so a release never goes out with missing packages.
    if: startsWith(github.ref, 'refs/tags/v') && success()
    needs: [linux, windows, macos, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Everything this run uploaded (also packaging.yml's RPM and Flatpak); only package
          # files are attached below.
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$APP_NAME $GITHUB_REF_NAME" --notes "Builds for Linux, Windows and macOS." --draft
          find out -type f \( -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' -o -name '*.rpm' -o -name '*.flatpak' \) -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber
