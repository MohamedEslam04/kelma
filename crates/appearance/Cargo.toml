[package]
name = "appearance"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kelma appearance preferences: theme, accent, density and font scale, plus the XDG desktop portal reader"
publish = false

[dependencies]
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# Same version and features as the tray crate, so the workspace builds one zbus.
# Needs a tokio runtime when the portal is read or watched.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
