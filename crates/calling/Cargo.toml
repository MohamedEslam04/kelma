[package]
name = "calling"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Teams calling for kelma: NGC signalling (epconv), trouter call pushes, WebRTC media, audio I/O"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"

# --- signalling (signaling.rs, invitation.rs, relay.rs, ngc_trouter.rs) ---
teams-proto = { version = "0.0.0", path = "../teams-proto" }

# --- media (media.rs) ---
webrtc = "=0.21.1"
rtc = { version = "=0.21.1", default-features = false }
async-trait = "0.1.89"
base64 = "0.22.1"
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
bytes = "1.12.0"
rand = "0.10.4"

# --- audio (audio.rs) ---

[dev-dependencies]
