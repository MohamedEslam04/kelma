[package]
name = "calling"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Teams calling for kelma: NGC signalling (epconv), trouter call pushes, WebRTC media, audio I/O"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"

# --- signalling (signaling.rs, invitation.rs, relay.rs, ngc_trouter.rs) ---
teams-proto = { version = "0.0.0", path = "../teams-proto" }

# --- media (media.rs) ---

# --- audio (audio/) ---
# `opus` bundles libopus via opusic-sys (cmake), so no system opus-devel is needed.
opus = "0.4.0"
cpal = { version = "0.18.2", optional = true }
hound = "3.5.1"

[dev-dependencies]

[features]
default = ["devices"]
# Microphone/speaker I/O through cpal (needs alsa-lib-devel on Linux). The Opus codec, WAV and tone
# endpoints build without it.
devices = ["dep:cpal"]
