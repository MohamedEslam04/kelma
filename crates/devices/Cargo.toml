[package]
name = "devices"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kelma devices: audio input/output and camera enumeration, test sound, mic level meter and loopback for the settings UI"
publish = false

[features]
default = ["audio", "cameras"]
# Real audio I/O through cpal (ALSA on Linux; PipeWire serves ALSA clients).
audio = ["dep:cpal"]
# V4L2 camera discovery through sysfs and read-only ioctls (Linux; no system library).
cameras = ["dep:libc"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
libc = { version = "0.2.189", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
