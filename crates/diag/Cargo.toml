[package]
name = "diag"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kelma diagnostics: redaction and a local problem-report bundle (nothing is uploaded)"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
flate2 = "1.1.11"
regex = "1.13.2"
serde_json = "1.0.154"
session = { version = "0.0.0", path = "../session" }
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
