[package]
name = "kelma-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client for kelma (protocol testing)"
publish = false

[dependencies]
anyhow = "1.0.104"
app_store = { package = "apps", version = "0.0.0", path = "../apps" }
devices = { version = "0.0.0", path = "../devices" }
diag = { version = "0.0.0", path = "../diag" }
calendar = { version = "0.0.0", path = "../calendar" }
render = { version = "0.0.0", path = "../render" }
reqwest = "0.13.5"
serde_json = "1.0.154"
onedrive = { version = "0.0.0", path = "../onedrive" }
preview = { version = "0.0.0", path = "../preview" }
session = { version = "0.0.0", path = "../session" }
teams-proto = { version = "0.0.0", path = "../teams-proto" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webhost = { version = "0.0.0", path = "../webhost" }
