[package]
name = "onedrive"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OneDrive and SharePoint files for kelma: browse, act, share, recycle bin"
publish = false

[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
teams-proto = { version = "0.0.0", path = "../teams-proto" }
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.8"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
