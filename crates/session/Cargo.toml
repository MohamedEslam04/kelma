[package]
name = "session"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kelma session persistence: refresh token in the system keyring, non-secret config on disk"
publish = false

[dependencies]
directories = "6.0.0"
# Secret Service on Linux, Keychain on macOS, Credential Manager on Windows (each backend is
# target-gated inside keyring, so every feature can stay on).
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
teams-proto = { version = "0.0.0", path = "../teams-proto" }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
