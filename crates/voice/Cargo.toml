[package]
name = "voice"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kelma voice messages: microphone recording, AAC-in-MP4 encoding (system ffmpeg), pure-Rust decoding, waveform peaks and pitch-keeping playback (no UI, no network)"
publish = false

[dependencies]
devices = { version = "0.0.0", path = "../devices" }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "id3v2"] }
thiserror = "2.0.21"
