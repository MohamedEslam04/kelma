[package]
name = "voice"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "IronTeams voice messages: microphone recording, AAC-in-MP4 encoding (ffmpeg on Linux, Media Foundation on Windows, AudioToolbox on macOS), pure-Rust decoding, waveform peaks and pitch-keeping playback (no UI, no network)"
publish = false

[dependencies]
compat = { version = "0.0.0", path = "../compat" }
devices = { version = "0.0.0", path = "../devices" }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "id3v2"] }
thiserror = "2.0.21"

# The system AAC encoder (`native_aac`): Media Foundation, loaded at run time.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader"] }
